<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><path fill="#9faaa0" d="M0 0h1000v750H0z"/><rect x="62" y="64" width="876" height="621" rx="9" fill="#efecdf"/><g fill="#343a32"><text x="108" y="111" font-family="monospace" font-size="9" letter-spacing="2">NOTES ON AN ORDINARY LIFE</text><text x="804" y="111" font-family="monospace" font-size="9">VOL. 001</text><text x="103" y="204" font-family="Georgia,serif" font-size="76" letter-spacing="-5">Ipsum Journal</text><path d="M105 229h790M105 617h790" stroke="#343a32" stroke-width="1"/><text x="105" y="258" font-family="monospace" font-size="8" letter-spacing="2">PLACES / PEOPLE / EVERYDAY THINGS</text><text x="520" y="340" font-family="Georgia,serif" font-size="37">The gentle art</text><text x="520" y="385" font-family="Georgia,serif" font-size="37" font-style="italic">of paying attention.</text><g font-family="Arial,sans-serif" font-size="13" fill="#717767"><text x="520" y="442">Sometimes, the most interesting things</text><text x="520" y="466">are the ones right in front of us.</text><text x="520" y="490">A collection of moments, noticed.</text></g><text x="520" y="561" font-family="monospace" font-size="9" letter-spacing="1">TAKE A SLOWER LOOK ↗</text><text x="778" y="660" font-family="monospace" font-size="8" fill="#757c6c">PLACEHOLDER / 02</text></g><path fill="#c2c8af" d="M105 292h366v288H105z"/><circle cx="360" cy="367" r="39" fill="#ece9c9"/><path d="M105 507 213 405l72 69 57-41 129 83v64H105" fill="#879778"/><path d="m105 550 154-86 212 90v26H105Z" fill="#566d55"/></svg>
